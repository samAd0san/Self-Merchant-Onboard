<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parcera · Operator Console Sign In</title>

  <!-- Stylesheets loaded in dependency order: tokens, base, layout, then components -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components/card.css" />
  <link rel="stylesheet" href="css/components/tabs.css" />
  <link rel="stylesheet" href="css/components/inputs.css" />
  <link rel="stylesheet" href="css/components/buttons.css" />
  <link rel="stylesheet" href="css/components/otp.css" />
  <noscript><style>body{opacity:1 !important;}</style></noscript>
</head>
<body>

  <main class="page">

    <!-- Brand header: logo mark, wordmark, positioning line, tagline -->
    <header class="brand">
      <img class="brand__logo" src="assets/logo-lockup.png" alt="Parcera" />
      <p class="brand__tagline">
        Welcome to Parcera Merchant Onboarding
      </p>
    </header>

    <!-- Auth card: hosts channel tabs plus the two-step sign-in flow -->
    <section class="auth-card" aria-label="Sign in to Parcera">

      <!-- Email / Phone channel switcher -->
      <div class="channel-tabs" role="tablist" aria-label="Sign-in method">
        <button type="button" class="channel-tab is-active" id="tab-phone" role="tab" aria-selected="true" data-channel="phone">
          <svg class="channel-tab__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          Phone
        </button>
        <button type="button" class="channel-tab" id="tab-email" role="tab" aria-selected="false" data-channel="email">
          <svg class="channel-tab__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
          Email
        </button>
      </div>

      <!-- Step 1a: Email entry panel -->
      <form class="auth-card__step is-hidden" id="step-email" data-step="email-entry" novalidate>
        <div class="field-group">
          <label class="field-group__label" for="input-email">Email Address</label>
          <div class="input-field">
            <svg class="input-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
            <input class="input-field__control" type="email" id="input-email" name="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
          <p class="field-group__error" role="alert"></p>
        </div>
        <button type="submit" class="btn btn--primary">
          Continue
          <svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </form>

      <!-- Step 1b: Phone entry panel -->
      <form class="auth-card__step" id="step-phone" data-step="phone-entry" novalidate>
        <div class="field-group">
          <label class="field-group__label" for="input-phone">Phone Number</label>
          <div class="input-field">
            <svg class="input-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <input class="input-field__control" type="tel" id="input-phone" name="phone" placeholder="(555) 123-4567" autocomplete="tel" required />
          </div>
          <p class="field-group__error" role="alert"></p>
        </div>
        <button type="submit" class="btn btn--primary">
          Continue
          <svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </form>

      <!-- Step 2: Verification code panel (shown after Continue) -->
      <form class="auth-card__step is-hidden" id="step-verify" data-step="verify" novalidate>
        <div class="verify-intro">
          <div class="verify-intro__icon-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <p class="verify-intro__copy">We sent a verification code to</p>
          <p class="verify-intro__destination" id="verify-destination">you@example.com</p>
          <button type="button" class="btn--tab-link" id="change-destination">Change email</button>
        </div>

        <div class="field-group">
          <label class="field-group__label" id="otp-label">Verification Code</label>
          <div class="otp-input" role="group" aria-labelledby="otp-label">
            <input class="otp-input__box" type="text" inputmode="numeric" maxlength="1" data-otp-index="0" aria-label="Digit 1" />
            <input class="otp-input__box" type="text" inputmode="numeric" maxlength="1" data-otp-index="1" aria-label="Digit 2" />
            <input class="otp-input__box" type="text" inputmode="numeric" maxlength="1" data-otp-index="2" aria-label="Digit 3" />
            <span class="otp-input__divider">—</span>
            <input class="otp-input__box" type="text" inputmode="numeric" maxlength="1" data-otp-index="3" aria-label="Digit 4" />
            <input class="otp-input__box" type="text" inputmode="numeric" maxlength="1" data-otp-index="4" aria-label="Digit 5" />
            <input class="otp-input__box" type="text" inputmode="numeric" maxlength="1" data-otp-index="5" aria-label="Digit 6" />
          </div>
        </div>

        <button type="submit" class="btn btn--primary btn--verify">
          Verify
          <svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
        <button type="button" class="btn btn--secondary" id="resend-code">Resend Code</button>
        <p class="resend-note" id="resend-note" aria-live="polite"></p>
      </form>

    </section>

    <!-- Legal / access footer -->
    <footer class="page-footer">
      <p>&copy; 2026 Parcera Inc.</p>
    </footer>

  </main>

  <!-- Application scripts, loaded as ES modules in dependency order -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
